---
- name: JT-00 Refresh workflow survey namespace choices
  hosts: localhost
  connection: local
  gather_facts: true
  tasks:
    - ansible.builtin.include_tasks: tasks/load_config.yml

    - name: Namespace choices stay the demo closed list
      ansible.builtin.set_fact:
        ns_choices: "{{ demo_namespaces }}"

    - name: Fetch workflow
      ansible.builtin.uri:
        url: "{{ aap_api_base }}/workflow_job_templates/?name=WF-Temporary-ACS-Policy-Exception"
        user: "{{ controller_user }}"
        password: "{{ aap_basic_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200]
      no_log: true
      register: wf_lookup

    - name: Fail if workflow missing
      ansible.builtin.assert:
        that: wf_lookup.json.count | int >= 1
        fail_msg: "WF-Temporary-ACS-Policy-Exception not found — apply aap-config first"

    - name: Build survey spec
      ansible.builtin.set_fact:
        wf_id: "{{ wf_lookup.json.results[0].id }}"
        survey_spec:
          name: ACS exception request
          description: "Form is convenience; the workflow is the control. JT-01 re-validates everything."
          spec:
            - question_name: Namespace
              question_description: Target namespace for the temporary ACS exclusion
              required: true
              type: multiplechoice
              variable: namespace
              choices: "{{ ns_choices }}"
            - question_name: Policy
              question_description: Allowlisted ACS policy only
              required: true
              type: multiplechoice
              variable: policy_name
              choices:
                - "Kubernetes Actions: Exec into Pod"
                - "Privileged Container"
            - question_name: Duration (minutes)
              question_description: Closed list only
              required: true
              type: multiplechoice
              variable: duration_minutes
              choices: ["5", "10", "15", "30", "60"]
            - question_name: Justification
              question_description: Required, min 10 characters (also enforced in JT-01)
              required: true
              type: textarea
              variable: justification
              min: 10
            - question_name: Ticket ID
              question_description: Optional change/incident ticket
              required: false
              type: text
              variable: ticket_id

    - name: PUT survey spec
      ansible.builtin.uri:
        url: "{{ aap_api_base }}/workflow_job_templates/{{ wf_id }}/survey_spec/"
        method: POST
        user: "{{ controller_user }}"
        password: "{{ aap_basic_password }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body: "{{ survey_spec }}"
        status_code: [200, 201]
      no_log: true

    - name: Lookup portal job template
      ansible.builtin.uri:
        url: "{{ aap_api_base }}/job_templates/?name=Temporary%20ACS%20Policy%20Exception"
        user: "{{ controller_user }}"
        password: "{{ aap_basic_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200]
      no_log: true
      register: portal_jt
      failed_when: false

    - name: PUT the same survey on the portal job template
      when: (portal_jt.json.count | default(0) | int) >= 1
      ansible.builtin.uri:
        url: "{{ aap_api_base }}/job_templates/{{ portal_jt.json.results[0].id }}/survey_spec/"
        method: POST
        user: "{{ controller_user }}"
        password: "{{ aap_basic_password }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body: "{{ survey_spec }}"
        status_code: [200, 201]
      no_log: true
