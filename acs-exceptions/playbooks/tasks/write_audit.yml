---
# Writes audit/<request_id>.json inside the job workspace (ephemeral on AAP).
# Job stdout prints the JSON for the demo. Git push only when GIT_TOKEN is set.
# Optional ConfigMap in aap-demo when the OpenShift credential is attached.
- name: Require request_id
  ansible.builtin.assert:
    that: request_id is defined and (request_id | length > 0)
    fail_msg: "request_id is required for audit records"

- name: Ensure audit directory
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../audit"
    state: directory
    mode: "0755"

- name: Load existing audit record if present
  ansible.builtin.slurp:
    src: "{{ playbook_dir }}/../audit/{{ request_id }}.json"
  register: audit_existing_raw
  failed_when: false

- name: Parse existing audit JSON
  ansible.builtin.set_fact:
    audit_existing: "{{ (audit_existing_raw.content | b64decode | from_json) if (audit_existing_raw.content is defined) else {} }}"

- name: Compose history entry
  ansible.builtin.set_fact:
    audit_history_entry:
      event: "{{ audit_event | default(audit_status | default('update')) }}"
      timestamp: "{{ ansible_date_time.iso8601 }}"
      actor: "{{ audit_actor | default(tower_user_name | default(awx_user_name | default('system'))) }}"

- name: Merge audit record
  ansible.builtin.set_fact:
    audit_record: "{{ audit_existing | combine({
        'request_id': request_id,
        'requester': requester | default(audit_existing.requester | default(tower_user_name | default(awx_user_name | default('unknown')))),
        'approver': approver | default(audit_existing.approver | default('')),
        'namespace': namespace | default(audit_existing.namespace | default('')),
        'policy': {'name': policy_name | default(audit_existing.policy.name | default('')), 'id': policy_id | default(audit_existing.policy.id | default(''))},
        'start_time': start_time | default(audit_existing.start_time | default('')),
        'end_time': end_time | default(audit_existing.end_time | default('')),
        'justification': justification | default(audit_existing.justification | default('')),
        'ticket_id': ticket_id | default(audit_existing.ticket_id | default('')),
        'approval_status': approval_status | default(audit_existing.approval_status | default('')),
        'approval_timestamp': approval_timestamp | default(audit_existing.approval_timestamp | default('')),
        'execution_status': execution_status | default(audit_existing.execution_status | default('')),
        'rollback_status': rollback_status | default(audit_existing.rollback_status | default('')),
        'rollback_verification': rollback_verification | default(audit_existing.rollback_verification | default('')),
        'failure_reason': failure_reason | default(audit_existing.failure_reason | default('')),
        'status': audit_status | default(audit_existing.status | default('unknown')),
        'residual_violations': residual_violations | default(audit_existing.residual_violations | default([])),
        'history': ((audit_existing.history | default([])) + [audit_history_entry])
      }, recursive=True) }}"

- name: Write audit JSON
  ansible.builtin.copy:
    dest: "{{ playbook_dir }}/../audit/{{ request_id }}.json"
    content: "{{ audit_record | to_nice_json }}"
    mode: "0644"

- name: Show audit record in job output (demo artifact)
  ansible.builtin.debug:
    var: audit_record

- name: Best-effort ConfigMap copy in aap-demo
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ request_id | lower }}"
        namespace: aap-demo
        labels:
          aapex: audit
          request_id: "{{ request_id }}"
      data:
        record.json: "{{ audit_record | to_nice_json }}"
  failed_when: false
  register: audit_cm

- name: Commit and push audit record when GIT_TOKEN is set
  when: lookup('env', 'GIT_TOKEN') | length > 0
  block:
    - name: Git add/commit/push audit file
      ansible.builtin.shell: |
        set -euo pipefail
        cd "{{ playbook_dir }}/.."
        git pull --rebase origin "{{ lookup('env', 'GIT_BRANCH') | default('main', true) }}" || true
        git add "audit/{{ request_id }}.json" audit/notifications.log || true
        if git diff --cached --quiet; then
          echo "no audit changes to commit"
          exit 0
        fi
        git commit -m "audit({{ request_id }}): {{ audit_event | default(audit_status) }}"
        REPO="${GIT_REPO_URL:-https://github.com/ypreiger/aap-demo.git}"
        git push "https://x-access-token:${GIT_TOKEN}@github.com/${REPO#*github.com/}" "HEAD:{{ lookup('env', 'GIT_BRANCH') | default('main', true) }}"
      environment:
        GIT_TOKEN: "{{ lookup('env', 'GIT_TOKEN') }}"
        GIT_REPO_URL: "{{ lookup('env', 'GIT_REPO_URL') | default('https://github.com/ypreiger/aap-demo.git', true) }}"
      no_log: true
      register: audit_git_push
      changed_when: "'no audit changes' not in (audit_git_push.stdout | default(''))"
