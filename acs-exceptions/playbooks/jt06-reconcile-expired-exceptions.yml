---
- name: JT-06 Reconcile expired AAPEX exclusions
  hosts: localhost
  connection: local
  gather_facts: true
  tasks:
    - ansible.builtin.include_tasks: tasks/load_config.yml

    - name: Fail closed if ACS token missing
      ansible.builtin.fail:
        msg: "ACS_TOKEN is not set — refusing to mutate ACS"
      when: acs_token | default('') | length == 0

    - name: Remove only AAPEX exclusions past their expiration
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/acs-reconcile-expired.py"
      environment:
        ACS_URL: "{{ acs_url }}"
        ACS_TOKEN: "{{ acs_token }}"
        ACS_VALIDATE_CERTS: "{{ acs_validate_certs }}"
      register: reconcile
      changed_when: "'changed=true' in (reconcile.stdout | default(''))"

    - ansible.builtin.debug:
        msg: "{{ reconcile.stdout_lines | default([]) }}"
