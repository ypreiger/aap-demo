---
# Portal-facing job template. The self-service portal syncs Job Templates only
# (not workflows). This job launches WF-Temporary-ACS-Policy-Exception and
# returns immediately so Create Task does not block on SRE approval.
- name: Launch temporary ACS exception workflow
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    namespace: "{{ namespace | default('') }}"
    policy_name: "{{ policy_name | default('') }}"
    duration_minutes: "{{ duration_minutes | default('') }}"
    justification: "{{ justification | default('') }}"
    ticket_id: "{{ ticket_id | default('') }}"
    workflow_name: WF-Temporary-ACS-Policy-Exception
  tasks:
    - ansible.builtin.include_tasks: tasks/load_config.yml

    - name: Resolve requester from the portal/AAP launch user
      ansible.builtin.set_fact:
        requesting_user: "{{ tower_user_name | default(awx_user_name | default('')) }}"

    - name: Fail without user context
      ansible.builtin.fail:
        msg: "Cannot resolve requester (tower_user_name/awx_user_name). Refusing to continue."
      when: requesting_user | length == 0

    - name: Lookup workflow
      ansible.builtin.uri:
        url: "{{ aap_api_base }}/workflow_job_templates/?name={{ workflow_name | urlencode }}"
        user: "{{ controller_user }}"
        password: "{{ aap_basic_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200, 401, 403, 404]
      no_log: true
      register: wf_lookup

    - name: Fail if workflow lookup was not authorized
      ansible.builtin.fail:
        msg: "AAP workflow lookup HTTP {{ wf_lookup.status | default('n/a') }} — check AAP API credential (admin user + token/password)."
      when: (wf_lookup.status | default(0) | int) != 200

    - ansible.builtin.assert:
        that: (wf_lookup.json.count | default(0) | int) >= 1
        fail_msg: "{{ workflow_name }} not found"

    - name: Launch workflow (do not wait for SRE approval)
      ansible.builtin.uri:
        url: "{{ aap_api_base }}/workflow_job_templates/{{ wf_lookup.json.results[0].id }}/launch/"
        method: POST
        user: "{{ controller_user }}"
        password: "{{ aap_basic_password }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          extra_vars:
            namespace: "{{ namespace }}"
            policy_name: "{{ policy_name }}"
            duration_minutes: "{{ duration_minutes }}"
            justification: "{{ justification }}"
            ticket_id: "{{ ticket_id }}"
            requesting_user: "{{ requesting_user }}"
        status_code: [201, 200]
      no_log: true
      register: wf_launch

    - ansible.builtin.debug:
        msg: >-
          Launched {{ workflow_name }} as workflow job
          {{ wf_launch.json.id | default('unknown') }} for {{ requesting_user }}.
          Sign in as sre-approver (AAP local user, not OpenShift) and approve at
          {{ aap_url }}/#/workflow_approvals
          Justification must be at least 10 characters.

    - ansible.builtin.set_stats:
        data:
          workflow_job_id: "{{ wf_launch.json.id | default('') }}"
          requesting_user: "{{ requesting_user }}"
          namespace: "{{ namespace }}"
          policy_name: "{{ policy_name }}"
