---
# Create a PAT in gateway → Automation Execution → Users → Tokens (or OAuth app token).
# Paste the HTTPS controller/API base URL and token below, then rename (drop .example) and apply:
#   oc apply -f aap-controller-api-secret.yaml
#
# Recommended host value: Route URL from `oc get route -n aap`, e.g. https://demo-aap-controller-gateway.... 
# Internal Service DNS may also work depending on TLS trust settings.
#
apiVersion: v1
kind: Secret
metadata:
  name: aap-controller-api
  namespace: aap
  labels:
    app.kubernetes.io/name: ragu-builder-aap-yamls
type: Opaque
stringData:
  host: "https://REPLACE_WITH_AUTOMATION_CONTROLLER_ROUTE_HOST"
  token: "REPLACE_WITH_OAUTH2_PERSONAL_ACCESS_TOKEN"
