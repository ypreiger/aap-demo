---
# Copy to a local file (do not commit real tokens), substitute values, then:
#   oc apply -f demo-aap-lightspeed-chatbot-config.secret.yaml -n aap
#
# Red Hat procedure: Deploying Ansible Lightspeed on OpenShift (AAP 2.6)
# Keys are stringData entries on an Opaque secret referenced by spec.lightspeed.chatbot_config_secret_name.
#
apiVersion: v1
kind: Secret
metadata:
  name: demo-aap-lightspeed-chatbot-config
  namespace: aap
  labels:
    app.kubernetes.io/name: aap-demo-lightspeed
type: Opaque
stringData:
  chatbot_model: "gpt-4.1-mini"
  chatbot_url: "REPLACE_INFERENCE_BASE_URL_WITH_V1" # e.g. https://api.openai.com/v1
  chatbot_token: "REPLACE_API_KEY_OR_TOKEN"
  chatbot_llm_provider_type: "openai" # rhelai_vllm | rhoai_vllm | openai | azure_openai
  # Optional — MCP integration (internal cluster DNS); match your AnsibleAutomationPlatform .metadata.name:
  aap_gateway_url: "http://demo-aap"
  aap_controller_url: "http://demo-aap-controller-service"
