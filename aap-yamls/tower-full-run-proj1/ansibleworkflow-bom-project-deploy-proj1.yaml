---
# Launches ONE Automation Controller Workflow Job against workflow_template_name bom-project-deploy.
# Survey answers are supplied via extra_vars (same as API launch). Tech Preview: AnsibleWorkflow.
# Apply after `oc apply -k ../tower/` and the Controller has synced the Git project + WFJT.
apiVersion: tower.ansible.com/v1alpha1
kind: AnsibleWorkflow
metadata:
  name: awf-bom-project-deploy-proj1
  namespace: aap
spec:
  connection_secret: aap-controller-api
  workflow_template_name: bom-project-deploy
  # Do not set inventory here: Controller rejects WFJT launches that override inventory
  # when the Workflow Job Template does not allow overrides (bom-project-deploy pins Demo Inventory).
  extra_vars:
    project_name: proj1
    vm_sizing_mode: cluster_instancetype
    vm_cluster_instancetype: u1.medium
    vm_cluster_preference: fedora
    vm_cpu_cores: 2
    vm_memory_gi: 4
    vm_root_disk_mode: datasource
    vm_container_root_image: quay.io/kubevirt/fedora-container-disk-images:41
    vm_datasource_name: fedora
    vm_datasource_namespace: openshift-virtualization-os-images
    vm_root_volume_size_gi: 30
    vm_extra_disk_gi: 0
    vm_cloud_user_password: changeme-workflow-vm
