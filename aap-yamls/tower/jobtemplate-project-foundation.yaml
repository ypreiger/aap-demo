---
# project_name supplied by workflow survey (bom-project-deploy); default below is illustrative only when run standalone.
apiVersion: tower.ansible.com/v1alpha1
kind: JobTemplate
metadata:
  name: jt-bom-project-foundation
  namespace: aap
spec:
  connection_secret: aap-controller-api
  name: bom-project-foundation
  organization: Default
  project: AAP Demo (GitHub)
  playbook: playbooks/project_foundation.yml
  inventory: Demo Inventory
  labels:
    - openshift-virtualization
    - self-service
  # Create "OpenShift or Kubernetes API Bearer Token" credential openshift-bom-target (Default org) before apply.
  credentials:
    - openshift-bom-target
  ask_variables_on_launch: false
  extra_vars:
    project_name: proj1
