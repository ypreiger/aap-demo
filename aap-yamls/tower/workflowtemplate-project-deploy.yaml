---
# Single entry point: prompts for project_name once, runs foundation then VMs (On Success only).
apiVersion: tower.ansible.com/v1alpha1
kind: WorkflowTemplate
metadata:
  name: wjt-bom-project-deploy
  namespace: aap
spec:
  connection_secret: aap-controller-api
  state: present
  name: bom-project-deploy
  organization: Default
  inventory: Demo Inventory
  description: >-
    Parameterized BOM deploy for any project folder under projects/(project_name)/bom.
    Prompt for project_name at launch. Order: foundation (namespace → SA → netpol),
    mandatory approval gate, then VM provisioning. VMs never run unless foundation succeeds and the approval is granted.
  ask_variables_on_launch: true
  extra_vars:
    project_name: proj1
  workflow_nodes:
    - identifier: step-foundation
      unified_job_template:
        type: job_template
        name: bom-project-foundation
        organization:
          name: Default
      related:
        success_nodes:
          - identifier: approve-before-vms
        failure_nodes: []
        always_nodes: []
    - identifier: approve-before-vms
      unified_job_template:
        organization:
          name: Default
        type: workflow_approval
        name: bom-approve-before-vms
        description: >-
          Foundation finished for the project from the workflow survey (project_name).
          Approve to create Fedora VMs; deny stops the workflow with no VM changes.
        timeout: 0
      related:
        success_nodes:
          - identifier: step-vms
        failure_nodes: []
        always_nodes: []
    - identifier: step-vms
      unified_job_template:
        type: job_template
        name: bom-project-vms
        organization:
          name: Default
      related:
        success_nodes: []
        failure_nodes: []
        always_nodes: []
