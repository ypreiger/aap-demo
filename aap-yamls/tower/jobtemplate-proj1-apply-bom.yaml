---
# Run after syncing the GitHub project (includes collections/requirements.yml for kubernetes.core).
# In the controller UI or API, associate an OpenShift / Kubernetes Bearer Token credential that can
# create namespaces and policies (elevated RBAC). The Resource Operator CR may not expose
# credentials fields; attach the credential to the Job Template manually if reconcile omits it.
apiVersion: tower.ansible.com/v1alpha1
kind: JobTemplate
metadata:
  name: jt-proj1-apply-bom
  namespace: aap
spec:
  connection_secret: aap-controller-api
  name: proj1-apply-bom
  organization: Default
  project: AAP Demo (GitHub)
  playbook: playbooks/apply_proj1_bom.yml
  inventory: Demo Inventory
