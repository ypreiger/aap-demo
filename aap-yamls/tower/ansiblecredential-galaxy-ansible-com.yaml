---
# Optional (Tech Preview): creates a Controller credential of type
# "Ansible Galaxy/Automation Hub API Token" for public https://galaxy.ansible.com/
#
# Apply only after Secret/aap-controller-api exists and the Resource Operator is running:
#   oc apply -f aap-yamls/tower/ansiblecredential-galaxy-ansible-com.yaml
#
# Then in Controller: Organizations → Default → Galaxy credentials → ensure this credential
# is listed (the operator should create the credential object; ordering is still managed in UI/API).
#
# If reconciliation fails on your operator build, use scripts/controller-wire-galaxy-for-default-org.sh instead.
apiVersion: tower.ansible.com/v1alpha1
kind: AnsibleCredential
metadata:
  name: galaxy-ansible-com
  namespace: aap
spec:
  connection_secret: aap-controller-api
  name: Galaxy (ansible.com)
  organization: Default
  description: Public Galaxy for aap-demo collections/requirements.yml
  type: "Ansible Galaxy/Automation Hub API Token"
  inputs: |
    url: https://galaxy.ansible.com/
    token: ""
