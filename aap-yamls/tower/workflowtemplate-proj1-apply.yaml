---
# Minimal workflow wrapping the BOM apply job template (extend with more nodes later).
apiVersion: tower.ansible.com/v1alpha1
kind: WorkflowTemplate
metadata:
  name: wjt-proj1-apply-workflow
  namespace: aap
spec:
  connection_secret: aap-controller-api
  state: present
  name: proj1-apply-bom-workflow
  organization: Default
  inventory: Demo Inventory
  description: Create proj1 namespace, SA proj1-sa, and restrictive NetworkPolicy (443 only).
  workflow_nodes:
    - identifier: step-apply-bom
      unified_job_template:
        type: job_template
        name: proj1-apply-bom
        organization:
          name: Default
      related:
        success_nodes: []
        failure_nodes: []
        always_nodes: []
