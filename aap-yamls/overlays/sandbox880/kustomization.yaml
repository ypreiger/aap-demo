---
# Cluster overlay: gp3-csi storage (no ODF), Lightspeed off until LLM secret exists.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aap
resources:
  - ../../01-ansibleautomationplatform.yaml
patches:
  - target:
      kind: AnsibleAutomationPlatform
      name: demo-aap
    patch: |-
      - op: replace
        path: /spec/hub/file_storage_storage_class
        value: gp3-csi
      - op: replace
        path: /spec/lightspeed/disabled
        value: true
