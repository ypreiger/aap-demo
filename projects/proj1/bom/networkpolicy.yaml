---
# Default deny for selected pods + TCP 443 ingress; egress allows DNS (:53 to openshift-dns), API (:6443), HTTPS (:443).
# Pods that match no NetworkPolicy remain unrestricted unless other policies apply;
# once this policy selects all pods in the namespace (podSelector: {}), only the
# rules below are allowed and all other ingress/egress is denied for those pods.
#
# Egress: cluster DNS (OpenShift CoreDNS), Kubernetes API (:6443), and HTTPS (:443).
# Fedoras /KubeVirt launcher pods otherwise break on cloud-init and guest registration.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-open-443
  namespace: proj1
  labels:
    app.kubernetes.io/managed-by: aap-demo
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 443
      # Omitting "from" allows any source allowed by the cluster (typical deny-all-but-port pattern).
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 6443
    - ports:
        - protocol: TCP
          port: 443
