---
# Default deny for selected pods + allow TCP 443 ingress and egress only.
# Pods that match no NetworkPolicy remain unrestricted unless other policies apply;
# once this policy selects all pods in the namespace (podSelector: {}), only the
# rules below are allowed and all other ingress/egress is denied for those pods.
#
# Tip: workloads often need UDP/TCP 53 to cluster DNS — add egress rules if needed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-open-443
  namespace: proj1
  labels:
    app.kubernetes.io/managed-by: aap-demo
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 443
      # Omitting "from" allows any source allowed by the cluster (typical deny-all-but-port pattern).
  egress:
    - ports:
        - protocol: TCP
          port: 443
