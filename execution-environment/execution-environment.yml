---
# Ansible Builder schema v3
# Docs: https://ansible.readthedocs.io/projects/builder/en/latest/
#
# Base image suggestions (match your Automation Controller entitlement):
#   - registry.redhat.io/ansible-automation-platform-25/ee-minimal-rhel8:latest
#   - quay.io/ansible/ansible-runner:latest
version: 3

dependencies:
  ansible_core:
    # kubernetes.core 6.x requires ansible-core 2.16+ (see ansible-galaxy install warnings on older cores).
    package_pip: ansible-core>=2.16.0,<2.19.0
  ansible_runner:
    package_pip: ansible-runner
  galaxy: ../collections/requirements.yml

images:
  base_image:
    name: docker.io/redhat/ubi9:latest
