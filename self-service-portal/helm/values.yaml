# Ansible automation portal (self-service) — Helm values for chart redhat-rhaap-portal 2.2.0
# Argo CD passes this file via multi-source ref: values (see argocd/application.yaml).
#
# Set clusterRouterBase to your OpenShift apps domain (oc get ingresscontroller cluster -o jsonpath='{.status.domain}').
redhat-developer-hub:
  nameOverride: rhaap-portal
  global:
    clusterRouterBase: apps.cluster-jx4b7.dynamic.redhatworkshops.io
    pluginMode: oci
    imageTagInfo: "2.2"
  upstream:
    backstage:
      appConfig:
        catalog:
          # Helm replaces the whole locations array — list every entry you need.
          locations:
            - type: url
              target: https://github.com/ansible/ansible-rhdh-templates/blob/v2.0.0/templates/ee-start-from-scratch.yaml
              rules:
                - allow: [Template]
            - type: url
              target: https://github.com/ypreiger/aap-demo/blob/main/self-service-portal/catalog/openshift-virtualization-location.yaml
              rules:
                - allow: [Location, Template]
            - type: url
              target: https://github.com/rh-mad-workshop/coolstore-software-templates/blob/demo-vm/showcase-templates.yaml
              rules:
                - allow: [Location, Template]
          providers:
            rhaap:
              # Merge into the chart's environment key — do NOT add a bare `production:` block
              # (that duplicates keys in app-config and can CrashLoop backstage-backend).
              '{{- include "catalog.providers.env" . }}':
                sync:
                  pahCollections:
                    enabled: true
                    repositories:
                      # Workshop collections mirrored from collections/requirements.yml
                      - name: community
                        schedule:
                          frequency: {hours: 6}
                          timeout: {minutes: 60}
                      # Red Hat certified content synced into Hub (published repo)
                      - name: published
                        schedule:
                          frequency: {days: 1}
                          timeout: {minutes: 60}
