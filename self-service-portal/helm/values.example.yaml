# Copy to values.yaml and set clusterRouterBase for your cluster.
# Chart: redhat-rhaap-portal (https://charts.openshift.io/) targetRevision: 2.2.0
# Release name (Argo): aap-portal → Route host: aap-portal-rhaap-portal-<namespace>.<clusterRouterBase>

redhat-developer-hub:
  nameOverride: rhaap-portal
  global:
    # Required — must NOT stay apps.example.com
    clusterRouterBase: apps.example.com
    pluginMode: oci
    # Match chart 2.2.0 lifecycle tag (see Red Hat Ansible automation portal lifecycle page)
    imageTagInfo: "2.2"
  upstream:
    backstage:
      appConfig:
        catalog:
          locations:
            - type: url
              target: https://github.com/ansible/ansible-rhdh-templates/blob/v2.0.0/templates/ee-start-from-scratch.yaml
              rules:
                - allow: [Template]
            - type: url
              target: https://github.com/<your-org>/<your-repo>/blob/main/self-service-portal/catalog/openshift-virtualization-location.yaml
              rules:
                - allow: [Location, Template]
            - type: url
              target: https://github.com/rh-mad-workshop/coolstore-software-templates/blob/demo-vm/showcase-templates.yaml
              rules:
                - allow: [Location, Template]
          providers:
            rhaap:
              '{{- include "catalog.providers.env" . }}':
                sync:
                  pahCollections:
                    enabled: true
                    repositories:
                      - name: community
                        schedule:
                          frequency: {hours: 6}
                          timeout: {minutes: 60}
                      - name: published
                        schedule:
                          frequency: {days: 1}
                          timeout: {minutes: 60}
