---
# Fedora VirtualMachines (KubeVirt). Renders VirtualMachine manifests from templates using
# extra_vars from Workflow survey (CPU/RAM/instance types/root disk/extra disk).
#
# Prerequisites: openshift-virtualization operator; optionally cluster instance types/preferences
# (see documentation/09_VIRT_WORKFLOW_SURVEY.md).
#
- name: Project BOM — virtual machines layer
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars/bom_vms_defaults.yml
  vars:
    bom_dir: "{{ playbook_dir }}/../projects/{{ project_name }}/bom"
  tasks:
    - ansible.builtin.import_tasks:
        file: "{{ playbook_dir }}/includes/bom_resolve_cluster_auth.yml"

    - name: BOM virtual machines (templated manifests)
      module_defaults:
        group/k8s:
          host: "{{ omit if ((_bom_ocp_api | length) == 0) else _bom_ocp_api }}"
          api_key: "{{ omit if ((_bom_ocp_token | length) == 0) else _bom_ocp_token }}"
          validate_certs: "{{ omit if ((_bom_ocp_api | length) == 0) else _bom_verify_ssl }}"
          ssl_ca_cert: >-
            {{ omit if ((_bom_ocp_api | length) == 0) or ((_bom_env_ca | length) == 0) else _bom_env_ca }}
      block:
        - name: Ensure project_name is set
          ansible.builtin.assert:
            that:
              - project_name is defined
              - (project_name | string | length) > 0
            fail_msg: "Provide extra var project_name (e.g. proj1 or proj2)."

        # Controller may pass empty string when password survey is skipped; do not let that override defaults.
        - name: Normalize cloud-init password when survey left blank
          ansible.builtin.set_fact:
            vm_cloud_user_password: >-
              {{ vm_cloud_user_password | string | trim
              if (vm_cloud_user_password | default('', true) | string | trim | length) > 0
              else 'changeme-workflow-vm' }}

        - name: Prerequisites — Namespace must exist
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Namespace
            name: "{{ project_name }}"
          register: prereq_ns
          failed_when: >-
            ((prereq_ns.resources | default([]) | length) < 1) or
            (prereq_ns.resources[0].status.phase | default("") != 'Active')

        - name: Prerequisites — foundation ServiceAccount expected
          kubernetes.core.k8s_info:
            api_version: v1
            kind: ServiceAccount
            name: "{{ project_name }}-sa"
            namespace: "{{ project_name }}"
          register: prereq_sa
          failed_when: prereq_sa.resources | default([]) | length < 1

        - name: Prerequisites — baseline NetworkPolicy expected
          kubernetes.core.k8s_info:
            api_version: networking.k8s.io/v1
            kind: NetworkPolicy
            name: deny-all-open-443
            namespace: "{{ project_name }}"
          register: prereq_np
          failed_when: prereq_np.resources | default([]) | length < 1

        - name: Optional — list cluster VirtualMachine instance types (for survey hints)
          kubernetes.core.k8s_info:
            api_version: instancetype.kubevirt.io/v1alpha2
            kind: VirtualMachineClusterInstancetype
          ignore_errors: true
          failed_when: false
          register: _cluster_instatypes

        - name: Warn when sizing uses cluster_instancetype but no cluster CR returned
          ansible.builtin.debug:
            msg: >-
              vm_sizing_mode=cluster_instancetype but listing VirtualMachineClusterInstancetype returned
              no resources — confirm OpenShift Virtualization is installed or switch survey to vm_sizing_mode=manual.
          when:
            - vm_sizing_mode | default('') == 'cluster_instancetype'
            - (_cluster_instatypes.resources | default([])) | length < 1

        - name: Render and apply Fedora VirtualMachines from template
          kubernetes.core.k8s:
            definition: "{{ lookup('template', 'bom-vm-fedora.yaml.j2') | from_yaml }}"
          loop: "{{ bom_vms }}"
          loop_control:
            label: "{{ item.vm_name }}"

        - name: Validate VirtualMachine exists ({{ item.vm_name }})
          kubernetes.core.k8s_info:
            api_version: kubevirt.io/v1
            kind: VirtualMachine
            namespace: "{{ project_name }}"
            name: "{{ item.vm_name }}"
          register: vm_chk
          failed_when: vm_chk.resources | default([]) | length < 1
          loop: "{{ bom_vms }}"
          loop_control:
            label: "{{ item.vm_name }}"
